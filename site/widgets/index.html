<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Widgets | Aslan Mammadli</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}
.wcard{display:block;border:1px solid #e2e8f0;border-radius:12px;padding:18px;text-decoration:none;color:inherit;transition:background .15s,border-color .15s}
.wcard:hover{background:#f8fafc;border-color:#cbd5e1}
.ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 6px 16px -6px rgba(15,23,42,.35)}
.ic svg{width:32px;height:32px}
.ic.gsc{background:linear-gradient(135deg,#2563eb,#7c3aed)}
.ic.vid{background:linear-gradient(135deg,#f43f5e,#f97316)}
.wcard .t{font-weight:600;font-size:17px}
.wcard .d{color:#64748b;font-size:14px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="name" href="/">Aslan Mammadli</a>
  </header>
  <main>
    <h1 class="page-title">Widgets</h1>
    <div class="wgrid">
      <a class="wcard" href="/gsc/"><div class="ic gsc"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 24V18M10.5 24V13M16 24V16"/><circle cx="21.5" cy="12.5" r="5.5"/><path d="M25.5 16.5L29 20"/><path d="M19 13l1.8 1.8L24 11" stroke-width="2"/></svg></div><div class="t">Search Console</div><div class="d">Clicks, impressions and rankings for all sites</div></a>
      <a class="wcard" href="/video/"><div class="ic vid"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="16" rx="3.5"/><path d="M21 14l7-4v12l-7-4"/><path d="M7.5 13h9M7.5 16.5h6M7.5 20h8" stroke-width="2"/></svg></div><div class="t">Prompter</div><div class="d">Teleprompter that records video to your phone</div></a>
    </div>
  </main>
</div>
</body>
</html>
